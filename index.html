<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>Descubre el Chimborazo</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <!-- MindAR -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>

    /* ==============================
       CONFIGURACIÓN GENERAL
    ============================== */

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      font-family: Arial, Helvetica, sans-serif;
    }


    /* ==============================
       PANTALLA INICIAL
    ============================== */

    #start-screen {
      position: fixed;
      inset: 0;
      z-index: 9999;

      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;

      padding: 30px;
      box-sizing: border-box;

      text-align: center;

      background: #FFC72C;
      color: #000000;
    }


    /* LOGO */

    #marca-pais-logo {
      width: 130px;
      max-width: 45vw;
      height: auto;

      object-fit: contain;
      display: block;

      margin: 0 auto 28px auto;
    }


    /* TÍTULO */

    #start-screen h1 {
      margin: 0 0 15px 0;

      font-size: 30px;
      font-weight: 700;
      line-height: 1.15;

      color: #000000;

      text-align: center;
    }


    /* DESCRIPCIÓN */

    #start-screen p {
      width: 100%;
      max-width: 400px;

      margin: 0 auto 30px auto;

      font-size: 17px;
      line-height: 1.5;

      color: #000000;

      text-align: center;
    }


    /* BOTÓN ACTIVAR CÁMARA */

    #start-button {
      border: none;
      border-radius: 12px;

      padding: 16px 30px;

      background: #FFFFFF;
      color: #000000;

      font-size: 18px;
      font-weight: bold;

      cursor: pointer;

      -webkit-tap-highlight-color: transparent;

      box-shadow: none;
    }

    #start-button:active {
      transform: scale(0.97);
    }


    /* MENSAJE DE CARGA */

    #loading {
      display: none;

      margin-top: 20px;

      color: #000000;

      font-size: 15px;
    }


    /* MENSAJE DE ERROR */

    #error-message {
      display: none;

      margin-top: 20px;

      max-width: 350px;

      padding: 15px;

      border-radius: 10px;

      background: rgba(255, 255, 255, 0.35);

      color: #000000;

      font-size: 14px;
      line-height: 1.4;
    }


    /* ==============================
       MENSAJE AL ENCONTRAR LA TARJETA
    ============================== */

    #found-message {
      display: none;

      position: fixed;

      z-index: 5000;

      left: 50%;
      bottom: 30px;

      transform: translateX(-50%);

      flex-direction: column;
      align-items: center;
      justify-content: center;

      text-align: center;

      pointer-events: auto;
    }


    /* TEXTO "CONOCE MÁS EN" */

    .more-text {
      margin-bottom: 10px;

      color: #FFFFFF;

      font-size: 15px;
      font-weight: 500;

      text-align: center;

      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.5);
    }


    /* ==============================
       BOTÓN ECUADOR.TRAVEL
    ============================== */

    #travel-button {
      display: inline-flex;

      align-items: center;
      justify-content: center;

      min-width: 190px;

      padding: 13px 24px;

      box-sizing: border-box;

      border-radius: 12px;

      /* AMARILLO DE MARCA */
      background: #FFC72C;

      color: #000000;

      font-size: 16px;
      font-weight: 700;

      text-decoration: none;

      cursor: pointer;

      -webkit-tap-highlight-color: transparent;

      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.25);

      transition: transform 0.15s ease;
    }

    #travel-button:active {
      transform: scale(0.96);
    }


    /* ==============================
       ELEMENTOS DE A-FRAME
    ============================== */

    .a-enter-vr {
      display: none !important;
    }

    a-scene {
      background: transparent !important;
    }

    canvas {
      background: transparent !important;
    }


    /* ==============================
       VIDEO
    ============================== */

    video[autoplay] {
      position: fixed !important;

      top: 0 !important;
      left: 0 !important;

      width: 100% !important;
      height: 100% !important;

      object-fit: cover !important;
    }


    /* ==============================
       RESPONSIVE
    ============================== */

    @media (max-width: 380px) {

      #marca-pais-logo {
        width: 115px;
        margin-bottom: 24px;
      }

      #start-screen h1 {
        font-size: 27px;
      }

      #start-screen p {
        font-size: 16px;
        max-width: 330px;
      }

      #start-button {
        font-size: 17px;
        padding: 15px 25px;
      }

    }


    @media (min-height: 800px) {

      #marca-pais-logo {
        margin-bottom: 28px;
      }

    }

  </style>

</head>


<body>


  <!-- =====================================
       PANTALLA INICIAL
  ====================================== -->

  <div id="start-screen">

    <img
      id="marca-pais-logo"
      src="./logo-marca-pais.png"
      alt="Ecuador, brilla auténticamente"
    >

    <h1>
      Descubre el Chimborazo
    </h1>

    <p>
      Apunta la cámara hacia la tarjeta del Chimborazo
      para descubrir la experiencia.
    </p>

    <button id="start-button">
      ACTIVAR CÁMARA
    </button>

    <div id="loading">
      Activando cámara...
    </div>

    <div id="error-message"></div>

  </div>



  <!-- =====================================
       MENSAJE CUANDO ENCUENTRA LA TARJETA
  ====================================== -->

  <div id="found-message">

    <div class="more-text">
      conoce más en
    </div>

    <a
      id="travel-button"
      href="https://ecuador.travel/"
      target="_blank"
      rel="noopener noreferrer"
    >
      ecuador.travel
    </a>

  </div>



  <!-- =====================================
       ESCENA AR
  ====================================== -->

  <a-scene
    id="ar-scene"

    mindar-image="
      imageTargetSrc: ./targets.mind;
      autoStart: false;
      uiScanning: yes;
      uiLoading: no;
      filterMinCF: 0.0001;
      filterBeta: 0.001;
    "

    color-space="sRGB"

    renderer="
      colorManagement: true;
      physicallyCorrectLights: true;
      alpha: true;
    "

    vr-mode-ui="enabled: false"

    device-orientation-permission-ui="enabled: false"

    embedded

    loading-screen="enabled: false"
  >


    <!-- =================================
         VIDEO
    ================================== -->

    <a-assets>

      <video
        id="chimborazo-video"

        src="./chimborazo-demo.mp4"

        preload="auto"

        loop

        muted

        playsinline

        webkit-playsinline

        crossorigin="anonymous"
      ></video>

    </a-assets>



    <!-- =================================
         IMAGE TARGET
    ================================== -->

    <a-entity
      id="target"
      mindar-image-target="targetIndex: 0"
    >

      <a-video
        id="ar-video"

        src="#chimborazo-video"

        position="0 0 0"

        rotation="0 0 0"

        width="1"

        height="0.648"

        material="
          shader: flat;
          transparent: false;
        "
      ></a-video>

    </a-entity>



    <!-- =================================
         CÁMARA
    ================================== -->

    <a-camera
      position="0 0 0"

      look-controls="enabled: false"

      cursor="fuse: false"
    ></a-camera>


  </a-scene>



  <!-- =====================================
       JAVASCRIPT
  ====================================== -->

  <script>

    /* ==============================
       ELEMENTOS
    ============================== */

    const startScreen =
      document.getElementById("start-screen");

    const startButton =
      document.getElementById("start-button");

    const loading =
      document.getElementById("loading");

    const errorMessage =
      document.getElementById("error-message");

    const foundMessage =
      document.getElementById("found-message");

    const scene =
      document.getElementById("ar-scene");

    const target =
      document.getElementById("target");

    const video =
      document.getElementById("chimborazo-video");


    /* ==============================
       CONFIGURACIÓN DEL VIDEO
    ============================== */

    video.muted = true;

    video.loop = true;

    video.playsInline = true;

    video.pause();



    /* ==============================
       BOTÓN ACTIVAR CÁMARA
    ============================== */

    startButton.addEventListener(
      "click",
      async function () {

        console.log(
          "Botón ACTIVAR CÁMARA presionado"
        );

        startButton.style.display = "none";

        loading.style.display = "block";

        errorMessage.style.display = "none";


        try {

          /* ------------------------------
             VERIFICAR SOPORTE DE CÁMARA
          ------------------------------ */

          if (
            !navigator.mediaDevices ||
            !navigator.mediaDevices.getUserMedia
          ) {

            throw new Error(
              "Este navegador no permite acceder a la cámara."
            );

          }


          console.log(
            "Solicitando permiso de cámara..."
          );


          /* ------------------------------
             SOLICITAR PERMISO
          ------------------------------ */

          const stream =
            await navigator.mediaDevices.getUserMedia({

              video: {

                facingMode: {
                  ideal: "environment"
                }

              },

              audio: false

            });


          console.log(
            "Permiso de cámara concedido"
          );


          /* ------------------------------
             DETENER STREAM TEMPORAL
          ------------------------------ */

          stream
            .getTracks()
            .forEach(function(track) {

              track.stop();

            });


          /* ------------------------------
             OBTENER SISTEMA MINDAR
          ------------------------------ */

          const mindarSystem =
            scene.systems[
              "mindar-image-system"
            ];


          if (!mindarSystem) {

            throw new Error(
              "No se pudo iniciar el sistema de realidad aumentada."
            );

          }


          console.log(
            "Iniciando MindAR..."
          );


          /* ------------------------------
             INICIAR MINDAR
          ------------------------------ */

          await mindarSystem.start();


          console.log(
            "MindAR iniciado correctamente"
          );


          /* ------------------------------
             OCULTAR PANTALLA INICIAL
          ------------------------------ */

          startScreen.style.display = "none";

          loading.style.display = "none";


        } catch (error) {

          console.error(
            "ERROR DE CÁMARA:",
            error
          );


          loading.style.display = "none";

          startButton.style.display = "block";

          errorMessage.style.display = "block";


          errorMessage.innerHTML =

            "No pudimos activar la cámara." +

            "<br><br>" +

            "<strong>Permite el acceso a la cámara</strong> " +

            "cuando el navegador lo solicite y vuelve a intentarlo." +

            "<br><br>" +

            "Error: " +

            error.message;

        }

      }
    );



    /* ==============================
       TARJETA ENCONTRADA
    ============================== */

    target.addEventListener(
      "targetFound",
      function () {

        console.log(
          "TARGET CHIMBORAZO ENCONTRADO"
        );


        /* Mostrar botón */

        foundMessage.style.display = "flex";


        /* Reproducir video */

        video
          .play()
          .catch(function(error) {

            console.log(
              "El navegador bloqueó la reproducción automática:",
              error
            );

          });

      }
    );



    /* ==============================
       TARJETA PERDIDA
    ============================== */

    target.addEventListener(
      "targetLost",
      function () {

        console.log(
          "TARGET CHIMBORAZO PERDIDO"
        );


        /* Ocultar botón */

        foundMessage.style.display = "none";


        /* Pausar video */

        video.pause();

      }
    );



    /* ==============================
       A-FRAME CARGADO
    ============================== */

    scene.addEventListener(
      "loaded",
      function () {

        console.log(
          "A-Frame cargado"
        );

      }
    );



    /* ==============================
       MANEJO DE ERRORES
    ============================== */

    window.addEventListener(
      "error",
      function(event) {

        console.error(
          "Error general:",
          event.error || event.message
        );

      }
    );

  </script>

</body>

</html>
