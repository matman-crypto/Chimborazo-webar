<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Descubre el Chimborazo | WebAR</title>
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:Arial,sans-serif}
#intro{position:fixed;z-index:20;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.86);color:#fff;text-align:center;padding:24px}
.box{max-width:360px}.box h1{font-family:Georgia,serif;font-size:30px;margin:0 0 10px}.box p{line-height:1.45;color:#ddd}
#start{background:#ffc72c;color:#111;border:0;border-radius:999px;padding:14px 24px;font-size:16px;font-weight:700}
#status{position:fixed;z-index:15;left:50%;bottom:24px;transform:translateX(-50%);background:rgba(0,0,0,.62);color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;white-space:nowrap}
#brand{position:fixed;z-index:15;top:18px;left:18px;color:#fff;background:rgba(0,0,0,.45);padding:8px 12px;border-radius:20px;font-size:13px}
</style>
</head>
<body>
<div id="intro">
  <div class="box">
    <h1>Descubre el Chimborazo</h1>
    <p>Permite el acceso a la cámara y apunta al frente de la tarjeta.</p>
    <button id="start">Activar cámara</button>
  </div>
</div>
<div id="brand">Ecuador brilla auténticamente 🇪🇨</div>
<div id="status">Apunta a la tarjeta del Chimborazo</div>

<a-scene
  mindar-image="imageTargetSrc: ./targets.mind; autoStart: false; uiLoading: yes; uiScanning: yes; uiError: yes;"
  color-space="sRGB"
  renderer="colorManagement: true, physicallyCorrectLights"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false">

  <a-assets>
    <video id="chimborazoVideo" src="./chimborazo-demo.mp4"
      preload="auto" loop muted playsinline crossorigin="anonymous"></video>
  </a-assets>

  <a-camera position="0 0 0" look-controls="enabled:false"></a-camera>

  <!-- targetIndex 0 = primera imagen de targets.mind -->
  <a-entity mindar-image-target="targetIndex:0">
    <a-video id="arVideo"
      src="#chimborazoVideo"
      position="0 0 0.02"
      width="0.92"
      height="0.596"
      rotation="0 0 0">
    </a-video>
  </a-entity>
</a-scene>

<script>
const scene=document.querySelector('a-scene');
const intro=document.getElementById('intro');
const start=document.getElementById('start');
const video=document.getElementById('chimborazoVideo');
const status=document.getElementById('status');

start.addEventListener('click',async()=>{
  intro.style.display='none';
  try { await video.play(); video.pause(); video.currentTime=0; } catch(e){}
  const system=scene.systems['mindar-image-system'];
  if(system) system.start();
});

scene.addEventListener('targetFound',()=>{
  video.play().catch(()=>{});
  status.textContent='✨ ¡Experiencia activada! Ecuador brilla auténticamente 🇪🇨';
});
scene.addEventListener('targetLost',()=>{
  video.pause();
  status.textContent='Apunta a la tarjeta del Chimborazo';
});
</script>
</body>
</html>
