<!DOCTYPE html>
<html lang="es">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>Descubre el Chimborazo</title>


  <!-- =====================================
       A-FRAME
  ====================================== -->

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>


  <!-- =====================================
       MINDAR
  ====================================== -->

  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>


  <style>

    html,
    body {

      margin: 0;
      padding: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      background: transparent;

      font-family: Arial, Helvetica, sans-serif;

    }



    /* ---------------------------------------
       PANTALLA INICIAL
    --------------------------------------- */

    #start-screen {

      position: fixed;

      inset: 0;

      z-index: 9999;

      display: flex;

      flex-direction: column;

      justify-content: center;

      align-items: center;

      padding: 30px;

      box-sizing: border-box;

      text-align: center;

      background: #000;

      color: white;

    }



    /* ---------------------------------------
       LOGO MARCA PAÍS
    --------------------------------------- */

    #marca-pais-logo {

      width: 180px;

      max-width: 55vw;

      height: auto;

      object-fit: contain;

      margin-bottom: 35px;

      display: block;

    }



    /* ---------------------------------------
       TÍTULO
    --------------------------------------- */

    #start-screen h1 {

      margin: 0 0 15px 0;

      font-size: 30px;

      font-weight: 700;

      line-height: 1.15;

    }



    /* ---------------------------------------
       TEXTO
    --------------------------------------- */

    #start-screen p {

      max-width: 400px;

      margin: 0 0 30px 0;

      font-size: 17px;

      line-height: 1.5;

      color: #ddd;

    }



    /* ---------------------------------------
       BOTÓN
    --------------------------------------- */

    #start-button {

      border: none;

      border-radius: 12px;

      padding: 16px 30px;

      background: #ffc72c;

      color: #000;

      font-size: 18px;

      font-weight: bold;

      cursor: pointer;

      -webkit-tap-highlight-color: transparent;

    }



    #start-button:active {

      transform: scale(0.97);

    }



    /* ---------------------------------------
       LOADING
    --------------------------------------- */

    #loading {

      display: none;

      margin-top: 20px;

      color: #fff;

      font-size: 15px;

    }



    /* ---------------------------------------
       MENSAJE DE ERROR
    --------------------------------------- */

    #error-message {

      display: none;

      margin-top: 20px;

      max-width: 350px;

      padding: 15px;

      border-radius: 10px;

      background: rgba(255, 60, 60, 0.15);

      color: #ffb3b3;

      font-size: 14px;

      line-height: 1.4;

    }



    /* ---------------------------------------
       MENSAJE CUANDO ENCUENTRA LA TARJETA
    --------------------------------------- */

    #found-message {

      display: none;

      position: fixed;

      z-index: 5000;

      left: 50%;

      bottom: 30px;

      transform: translateX(-50%);

      padding: 12px 20px;

      border-radius: 25px;

      background: rgba(0, 0, 0, 0.75);

      color: white;

      font-size: 15px;

      font-weight: 600;

      white-space: nowrap;

      pointer-events: none;

    }



    /* ---------------------------------------
       A-FRAME
    --------------------------------------- */

    .a-enter-vr {

      display: none !important;

    }



    /* ---------------------------------------
       ESCENA TRANSPARENTE
    --------------------------------------- */

    a-scene {

      background: transparent !important;

    }



    /* ---------------------------------------
       CANVAS TRANSPARENTE
    --------------------------------------- */

    canvas {

      background: transparent !important;

    }



    /* ---------------------------------------
       VIDEO DE LA CÁMARA DE MINDAR
    --------------------------------------- */

    video[autoplay] {

      position: fixed !important;

      top: 0 !important;

      left: 0 !important;

      width: 100% !important;

      height: 100% !important;

      object-fit: cover !important;

    }



    /* ---------------------------------------
       RESPONSIVE PARA CELULARES PEQUEÑOS
    --------------------------------------- */

    @media (max-width: 380px) {

      #marca-pais-logo {

        width: 150px;

        margin-bottom: 25px;

      }

      #start-screen h1 {

        font-size: 27px;

      }

      #start-screen p {

        font-size: 16px;

      }

      #start-button {

        font-size: 17px;

        padding: 15px 25px;

      }

    }



    /* ---------------------------------------
       PANTALLAS ALTAS
    --------------------------------------- */

    @media (min-height: 800px) {

      #marca-pais-logo {

        margin-bottom: 40px;

      }

    }

  </style>

</head>



<body>


  <!-- =====================================
       PANTALLA PARA ACTIVAR LA CÁMARA
  ====================================== -->

  <div id="start-screen">


    <!-- =====================================
         LOGO MARCA PAÍS
    ====================================== -->

    <img

      id="marca-pais-logo"

      src="./logo-marca-pais.png"

      alt="Ecuador, brilla auténticamente"

    >


    <!-- =====================================
         TÍTULO
    ====================================== -->

    <h1>

      Descubre el Chimborazo

    </h1>


    <!-- =====================================
         DESCRIPCIÓN
    ====================================== -->

    <p>

      Apunta la cámara hacia la tarjeta del Chimborazo
      para descubrir la experiencia.

    </p>


    <!-- =====================================
         BOTÓN
    ====================================== -->

    <button id="start-button">

      ACTIVAR CÁMARA

    </button>


    <!-- =====================================
         LOADING
    ====================================== -->

    <div id="loading">

      Activando cámara...

    </div>


    <!-- =====================================
         ERROR
    ====================================== -->

    <div id="error-message"></div>


  </div>



  <!-- =====================================
       MENSAJE DE EXPERIENCIA
  ====================================== -->

  <div id="found-message">

    🇪🇨 ECUADOR - Brilla auténticamente ✨

  </div>



  <!-- =====================================
       EXPERIENCIA WEBAR
  ====================================== -->

  <a-scene

    id="ar-scene"


    mindar-image="

      imageTargetSrc: ./targets.mind;

      autoStart: false;

      uiScanning: yes;

      uiLoading: no;

      filterMinCF: 0.0001;

      filterBeta: 0.001;

    "


    color-space="sRGB"


    renderer="

      colorManagement: true;

      physicallyCorrectLights: true;

      alpha: true;

    "


    vr-mode-ui="enabled: false"


    device-orientation-permission-ui="enabled: false"


    embedded


    loading-screen="enabled: false"

  >



    <!-- =====================================
         VIDEO
    ====================================== -->

    <a-assets>

      <video

        id="chimborazo-video"

        src="./chimborazo-demo.mp4"

        preload="auto"

        loop

        muted

        playsinline

        webkit-playsinline

        crossorigin="anonymous"

      ></video>

    </a-assets>



    <!-- =====================================
         TARGET
    ====================================== -->

    <a-entity

      id="target"

      mindar-image-target="targetIndex: 0"

    >


      <!-- ===================================
           VIDEO SOBRE LA TARJETA
      ==================================== -->

      <a-video

        id="ar-video"

        src="#chimborazo-video"

        position="0 0 0"

        rotation="0 0 0"

        width="1"

        height="0.648"

        material="

          shader: flat;

          transparent: false;

        "

      ></a-video>


    </a-entity>



    <!-- =====================================
         CÁMARA
    ====================================== -->

    <a-camera

      position="0 0 0"

      look-controls="enabled: false"

      cursor="fuse: false"

    ></a-camera>


  </a-scene>



  <!-- =====================================
       JAVASCRIPT
  ====================================== -->

  <script>


    // ---------------------------------------
    // ELEMENTOS
    // ---------------------------------------

    const startScreen =
      document.getElementById(
        "start-screen"
      );


    const startButton =
      document.getElementById(
        "start-button"
      );


    const loading =
      document.getElementById(
        "loading"
      );


    const errorMessage =
      document.getElementById(
        "error-message"
      );


    const foundMessage =
      document.getElementById(
        "found-message"
      );


    const scene =
      document.getElementById(
        "ar-scene"
      );


    const target =
      document.getElementById(
        "target"
      );


    const video =
      document.getElementById(
        "chimborazo-video"
      );



    // ---------------------------------------
    // CONFIGURACIÓN DEL VIDEO
    // ---------------------------------------

    video.muted = true;

    video.loop = true;

    video.playsInline = true;


    // No reproducir hasta encontrar
    // la tarjeta

    video.pause();



    // ---------------------------------------
    // ACTIVAR CÁMARA
    // ---------------------------------------

    startButton.addEventListener(

      "click",

      async function () {


        console.log(
          "Botón ACTIVAR CÁMARA presionado"
        );


        startButton.style.display =
          "none";


        loading.style.display =
          "block";


        errorMessage.style.display =
          "none";



        try {


          // -----------------------------------
          // COMPROBAR NAVEGADOR
          // -----------------------------------

          if (

            !navigator.mediaDevices ||

            !navigator.mediaDevices
              .getUserMedia

          ) {


            throw new Error(

              "Este navegador no permite acceder a la cámara."

            );

          }



          // -----------------------------------
          // SOLICITAR PERMISO
          // -----------------------------------

          console.log(
            "Solicitando permiso de cámara..."
          );


          const stream =

            await navigator.mediaDevices
              .getUserMedia({

                video: {

                  facingMode: {

                    ideal: "environment"

                  }

                },

                audio: false

              });



          console.log(
            "Permiso de cámara concedido"
          );



          // -----------------------------------
          // CERRAR STREAM TEMPORAL
          // -----------------------------------

          stream
            .getTracks()
            .forEach(

              function(track) {

                track.stop();

              }

            );



          // -----------------------------------
          // OBTENER SISTEMA MINDAR
          // -----------------------------------

          const mindarSystem =

            scene.systems[
              "mindar-image-system"
            ];



          if (!mindarSystem) {


            throw new Error(

              "No se pudo iniciar el sistema de realidad aumentada."

            );

          }



          console.log(
            "Iniciando MindAR..."
          );



          // -----------------------------------
          // INICIAR MINDAR
          // -----------------------------------

          await mindarSystem.start();



          console.log(
            "MindAR iniciado correctamente"
          );



          // -----------------------------------
          // OCULTAR PANTALLA INICIAL
          // -----------------------------------

          startScreen.style.display =
            "none";


          loading.style.display =
            "none";


        }


        catch (error) {


          console.error(
            "ERROR DE CÁMARA:",
            error
          );


          loading.style.display =
            "none";


          startButton.style.display =
            "block";


          errorMessage.style.display =
            "block";



          errorMessage.innerHTML =

            "No pudimos activar la cámara.<br><br>" +

            "<strong>Permite el acceso a la cámara</strong> " +

            "cuando el navegador lo solicite y vuelve a intentarlo." +

            "<br><br>" +

            "Error: " +

            error.message;

        }

      }

    );



    // ---------------------------------------
    // CUANDO SE ENCUENTRA LA TARJETA
    // ---------------------------------------

    target.addEventListener(

      "targetFound",

      function () {


        console.log(
          "TARGET CHIMBORAZO ENCONTRADO"
        );


        // Mostrar mensaje

        foundMessage.style.display =
          "block";


        // Reproducir video

        video
          .play()
          .catch(

            function(error) {


              console.log(

                "El navegador bloqueó " +
                "la reproducción automática:",

                error

              );

            }

          );

      }

    );



    // ---------------------------------------
    // CUANDO SE PIERDE LA TARJETA
    // ---------------------------------------

    target.addEventListener(

      "targetLost",

      function () {


        console.log(
          "TARGET CHIMBORAZO PERDIDO"
        );


        foundMessage.style.display =
          "none";


        video.pause();

      }

    );



    // ---------------------------------------
    // ESCENA CARGADA
    // ---------------------------------------

    scene.addEventListener(

      "loaded",

      function () {


        console.log(
          "A-Frame cargado"
        );

      }

    );



    // ---------------------------------------
    // ERRORES GENERALES
    // ---------------------------------------

    window.addEventListener(

      "error",

      function(event) {


        console.error(

          "Error general:",

          event.error ||
          event.message

        );

      }

    );


  </script>


</body>
</html>
